name: StandardJS
on:
  push:
    branches: [main, "3.1"]
  pull_request:
    branches: [main, "3.1"]

jobs:
  standardjs:
    name: StandardJS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - run: yarn install
      - run: yarn standard
      - run: yarn check:manifest
