name: StandardJS
on:
  push:
    branches: [main, "3.1"]
  pull_request:
    branches: [main, "3.1"]

jobs:
  standardjs:
    name: StandardJS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Before setup-node, whose yarn cache asks `yarn` for its cache folder: the
      # runner's global yarn 1 refuses a project whose packageManager is yarn 4.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - run: yarn install
      - run: yarn standard
      - run: yarn check:manifest
