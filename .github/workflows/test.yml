name: Tests
on:
  push:
    branches: [main, "3.1"]
  pull_request:
    branches: [main, "3.1"]

jobs:
  test:
    runs-on: ubuntu-latest
    # El job publica un comentario de cobertura en el PR, así que necesita
    # escritura sobre pull-requests. Sin este bloque hereda el default del repo,
    # y en un run disparado por Dependabot ese default es de SOLO LECTURA (#1141).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        env:
          # `bali-rubocop` es un repo privado y el GITHUB_TOKEN del workflow solo alcanza
          # a este repo, así que sin esto `bundle install` muere clonándolo (exit 11).
          # Mismo secreto y misma forma que las siete apps de la flota.
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BUNDLE_GITHUB_TOKEN }}
        with:
          bundler-cache: true
      # Before setup-node, whose yarn cache asks `yarn` for its cache folder: the
      # runner's global yarn 1 refuses a project whose packageManager is yarn 4.
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not 20: @blocknote/core 0.52 depends on lib0 1.0.0-rc.22, whose
          # engines.node is ">=22", and Yarn 4 installs it on Node 20 without a warning.
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: test/dummy/yarn.lock
      - name: Install Node dependencies
        run: cd test/dummy && yarn install
      - name: Run JavaScript unit tests
        run: node --test 'test/javascript/**/*.test.js'
      - name: Set up database schema
        run: bin/rails db:schema:load
        env:
          RAILS_ENV: test
      - name: Build assets
        run: cd test/dummy && bin/rails tailwindcss:build && yarn build
      - name: Run tests with coverage
        run: bundle exec rails test
        env:
          COVERAGE: '1'
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/.last_run.json ] || exit 0
          LINE=$(ruby -rjson -e "puts JSON.parse(File.read('coverage/.last_run.json'))['result']['line']")
          BRANCH=$(ruby -rjson -e "puts JSON.parse(File.read('coverage/.last_run.json'))['result']['branch']")

          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Minimum |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Line | ${LINE}% | 80% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${BRANCH}% | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "$LINE < 80" | bc -l) )); then
            echo "> **Line coverage is below 80% minimum.** Add tests to increase coverage." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Comment coverage on PR
        # Comodidad, no una puerta: si el token no alcanza (Dependabot, un fork)
        # o el reporte no existe porque las pruebas reventaron antes, el paso se
        # salta sin pintar de rojo un job cuyas pruebas sí pasaron.
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('coverage/.last_run.json', 'utf8'));
            const line = data.result.line;
            const branch = data.result.branch;
            const status = line >= 80 ? ':white_check_mark:' : ':x:';

            const body = [
              `## ${status} Test Coverage`,
              '',
              '| Metric | Coverage | Minimum |',
              '|--------|----------|---------|',
              `| Line | **${line}%** | 80% |`,
              `| Branch | **${branch}%** | — |`,
              '',
              line < 80 ? '> **Line coverage is below 80% minimum.** Add tests to increase coverage.' : '',
              '',
              '*Generated by CI — updates on each push.*'
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Test Coverage') && c.body.includes('Generated by CI'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Bali's own lock stays on ransack 5, which the fleet runs (#1530). This job runs with ransack 6
  # the tests written to hold under both versions; the rest of the suite pins the names ransack 5
  # gets. "the switch is whether the installed ransack is 6" only fails here.
  test-ransack-6:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: gemfiles/ransack_6.gemfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # No bundler-cache: it installs in deployment mode from a versioned lock, and a frozen copy of
      # Gemfile.lock breaks on any change to the Gemfile, the gemspec or Bali's version.
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
      - name: Derive the ransack 6 lock from Gemfile.lock and install
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BUNDLE_GITHUB_TOKEN }}
        run: |
          cp Gemfile.lock gemfiles/ransack_6.gemfile.lock
          bundle lock --update ransack --conservative
          bundle install
      - name: Check that ransack 6 is the one installed
        run: |
          bundle exec ruby -e 'abort "ransack #{Gem.loaded_specs["ransack"].version}, not 6" unless Gem.loaded_specs["ransack"].version >= Gem::Version.new("6")'
      - name: Set up database schema
        run: bin/rails db:schema:load
        env:
          RAILS_ENV: test
      # One `-i` per test: an `-i` that matches nothing makes minitest exit 1.
      - name: Run the filter tests that hold under both ransack versions
        run: |
          bin/rails test test/bali/filter_form_text_predicates_test.rb test/bali/filter_form_operators_test.rb \
            test/bali/filter_form_between_test.rb
          bin/rails test test/bali/components/filters/condition/component_test.rb -i /carries_the_operators/
          bin/rails test test/bali/components/filters/condition/component_test.rb -i /offers_one_operator/
          bin/rails test test/bali/components/filters/condition/component_test.rb -i /lone_operator/
          bin/rails test test/bali/components/filters/component_test.rb -i /operators_reach_its_option/
          bin/rails test test/bali/components/data_table/saved_views_test.rb -i /every_name_the_form/
          bin/rails test test/bali/filter_form_test.rb -i /EnumCastingFilterFormTest/
