name: Security
on:
  push:
    branches: [main, "3.1"]
  pull_request:
    branches: [main, "3.1"]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        env:
          # `bali-rubocop` es un repo privado y el GITHUB_TOKEN del workflow solo alcanza
          # a este repo, así que sin esto `bundle install` muere clonándolo (exit 11).
          # Mismo secreto y misma forma que las siete apps de la flota.
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BUNDLE_GITHUB_TOKEN }}
        with:
          bundler-cache: true
      - name: Run Brakeman
        run: bundle exec brakeman --no-pager
      - name: Run bundler-audit
        run: bundle exec bundle-audit check --update
