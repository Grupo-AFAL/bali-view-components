name: Cypress Tests
on:
  push:
    branches: [main, "3.1"]
  pull_request:
    branches: [main, "3.1"]

jobs:
  # The run split in four, side by side: scripts/cypress-part.mjs says which specs each part takes.
  cypress-part:
    name: cypress (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        env:
          # `bali-rubocop` es un repo privado y el GITHUB_TOKEN del workflow solo alcanza
          # a este repo, así que sin esto `bundle install` muere clonándolo (exit 11).
          # Mismo secreto y misma forma que las siete apps de la flota.
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BUNDLE_GITHUB_TOKEN }}
        with:
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not 20: @blocknote/core 0.52 depends on lib0 1.0.0-rc.22, whose
          # engines.node is ">=22". On Node 20 installing test/dummy aborts with
          # "Found incompatible module" before the server ever boots.
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            test/dummy/yarn.lock

      # Los previews del DataTable leen de la BASE (escenario "Live DB"), así que un schema
      # vacío los renderiza sin una sola fila y los specs fallan buscando elementos que el
      # componente nunca tuvo qué pintar — no por una regresión. `seeds.rb` crea todo con
      # find_or_create_by! / find_or_initialize_by y no borra nada, así que es idempotente.
      - name: Setup database
        run: cd test/dummy && bin/rails db:schema:load db:seed

      - name: Install dependencies
        run: |
          yarn install
          cd test/dummy && yarn install

      - name: Build Tailwind CSS
        run: cd test/dummy && bin/rails tailwindcss:build

      - name: Build JS assets
        run: cd test/dummy && yarn build

      - name: Precompile assets
        run: cd test/dummy && bin/rails assets:precompile

      - name: Start server
        run: cd test/dummy && bin/rails server -p 3001 &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3001 --timeout 60000

      - name: Run Cypress tests
        run: |
          specs=$(node scripts/cypress-part.mjs ${{ matrix.part }} ${{ strategy.job-total }})
          yarn cypress run --browser chrome --spec "$specs"

      # Sin esto, un flake solo deja el mensaje del assert: el screenshot que
      # Cypress ya toma en cada fallo se quedaba en el runner. Con la página
      # a la vista, "never found it" se vuelve diagnosticable.
      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots-part-${{ matrix.part }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

  # The check the `main` ruleset requires is called `cypress`, and no part of the matrix is: this
  # job is it, and it fails unless every part passed.
  cypress:
    needs: cypress-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: test "${{ needs.cypress-part.result }}" = success
