name: Cypress Tests
on:
  push:
    branches: [main, "3.0"]
  pull_request:
    branches: [main, "3.0"]

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not 20: @blocknote/core 0.52 depends on lib0 1.0.0-rc.22, whose
          # engines.node is ">=22". On Node 20 installing spec/dummy aborts with
          # "Found incompatible module" before the server ever boots.
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            spec/dummy/yarn.lock

      # Los previews del DataTable leen de la BASE (escenario "Live DB"), así que un schema
      # vacío los renderiza sin una sola fila y los specs fallan buscando elementos que el
      # componente nunca tuvo qué pintar — no por una regresión. `seeds.rb` crea todo con
      # find_or_create_by! / find_or_initialize_by y no borra nada, así que es idempotente.
      - name: Setup database
        run: cd spec/dummy && bin/rails db:schema:load db:seed

      - name: Install dependencies
        run: |
          yarn install
          cd spec/dummy && yarn install

      - name: Build Tailwind CSS
        run: cd spec/dummy && bin/rails tailwindcss:build

      - name: Build JS assets
        run: cd spec/dummy && yarn build

      - name: Precompile assets
        run: cd spec/dummy && bin/rails assets:precompile

      - name: Start server
        run: cd spec/dummy && bin/rails server -p 3001 &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3001 --timeout 60000

      - name: Run Cypress tests
        run: yarn cypress run --browser chrome
