nodeLinker: node-modules

# Yarn 4.18's defaults for a new project are no install scripts and a one-day
# age gate. cypress downloads its binary in postinstall, and under the gate a
# range quietly resolves to the release before one published that day: with
# vite 8.3.4 three hours old, `vite@^8.3.0` locked 8.3.3. That is `yarn up
# daisyui` on daisyUI's release day.
enableScripts: true
npmMinimalAgeGate: 0
