        number: "0"
        select_date: "Seleccionar fecha..."
        select_datetime: "Seleccionar fecha y hora..."
        select_date_range: "Seleccionar rango de fechas..."
        select: "Seleccionar..."
        select_values: "Seleccionar valores..."

