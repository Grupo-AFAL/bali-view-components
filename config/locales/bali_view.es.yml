    # Form builder
    form_builder:
      date_fields:
        # Coincide con el orden de tokens no localizado de flatpickr ("F j, Y":
        # nombre de mes, día, año) en vez del orden habitual en español, porque
        # es el texto literal que el campo va a intentar interpretar.
        allow_input_placeholder: "ej. diciembre 31, 2026"
        clear: "Limpiar fecha"
        previous: "Fecha anterior"
        next: "Fecha siguiente"
        # Se escribe entre las dos fechas de un rango Y se usa para volver a
        # separarlas, así que una traducción tiene que seguir siendo reversible.
        range_separator: " a "
      # Salen del namespace `helpers.*` del host, donde esta gema no tenía nada
      # que escribir (Rails lo usa para labels y submits de sus forms).
      coordinates_polygon:
        clear: "Limpiar"
        clear_holes: "Limpiar agujeros"
        confirm: "¿Estás seguro(a)?"
