        contains: "contiene"
        equals: "es exactamente"
        starts_with: "comienza con"
        ends_with: "termina con"
        not_contains: "no contiene"
        not_equals: "no es"
        # Date/time operators
        "on": "es"
        is: "es"
        is_not: "no es"
        between: "entre"
        after: "después de"
        before: "antes de"
        on_or_after: "en o después de"
        on_or_before: "en o antes de"
        # Select operators
        is_any_of: "es cualquiera de"
        is_not_any_of: "no es ninguno de"
        # Number operators
        greater_than: "mayor que"
        less_than: "menor que"
        greater_than_or_equal: "mayor o igual que"
        less_than_or_equal: "menor o igual que"

