        dismiss: "Cerrar error"
        remove_file: "Eliminar %{filename}"

    # FilterForm — búsqueda rápida en varias columnas
    filter_form:
      search_placeholder_with_fields: "Buscar por %{fields}..."

    # Form builder
    form_builder:
      # Read to screen readers next to the caption of a required field; the asterisk
      # beside it is aria-hidden (#1125).
      required: "obligatorio"
      date_fields:
        # Coincide con el orden de tokens no localizado de flatpickr ("F j, Y":
        # nombre de mes, día, año) en vez del orden habitual en español, porque
        # es el texto literal que el campo va a intentar interpretar.
        allow_input_placeholder: "ej. diciembre 31, 2026"
        clear: "Limpiar fecha"
        previous: "Fecha anterior"
        next: "Fecha siguiente"
        # Se escribe entre las dos fechas de un rango Y se usa para volver a
        # separarlas, así que una traducción tiene que seguir siendo reversible.
        range_separator: " a "
      # Salen del namespace `helpers.*` del host, donde esta gema no tenía nada
      # que escribir (Rails lo usa para labels y submits de sus forms).
      coordinates_polygon:
        clear: "Limpiar"
        clear_holes: "Limpiar agujeros"
        confirm: "¿Estás seguro(a)?"
      dynamic_fields:
        add: "Agregar"
      submit:
        cancel: "Cancelar"
      dictation:
        dictate: "Dictar"
        # Shown when a dictation did not happen — a refused permission, a blocked service, one
        # bad second of network. It does not say which: the mic stays, and trying again is the
        # only thing the reader can do about any of them.
        unavailable: "No se pudo dictar. Inténtalo de nuevo."
      file:
        choose_file: "Seleccionar archivo"
        no_file_selected: "Ningún archivo seleccionado"
      search:
        placeholder: "Buscar..."
        submit: "Buscar"
      slim_select:
        placeholder: "Selecciona una opción"
        search_placeholder: "Buscar"
        select_all: "Seleccionar todo"
        deselect_all: "Deseleccionar todo"
        no_results: "Sin resultados"
        searching: "Buscando..."
        results: "Resultados"
        ajax_placeholder: "Escribe al menos 2 caracteres para buscar..."
        ajax_error: "No se pudo completar la búsqueda. Intenta de nuevo."
        # SlimSelect fills in `{number}`, `{value}` and `{count}` itself. Written as
        # Rails' `%{number}`, the count comes out as "%27 seleccionados".
        max_values_message: "{number} seleccionados"
        addable: 'Presiona "Enter" para agregar {value}'
        deselect: "Borrar selección"
        remove: "Quitar"
        results_count: "{count} resultados disponibles"

