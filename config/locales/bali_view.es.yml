        palette_receive_task_summary: "Espera un mensaje de otro participante; termina cuando el mensaje llega."
        palette_receive_task_when: "Un paso que espera algo de fuera — p. ej. «Recibir la cotización del proveedor»."
        palette_receive_task_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. El menú rápido junto al elemento agrega el siguiente elemento ya conectado; pedirle una segunda salida ofrece «Bifurcar con» un gateway. Se exporta a BPMN XML como <bpmn:receiveTask>."
        palette_script_task_summary: "Un script que el motor de procesos ejecuta por sí mismo."
        palette_script_task_when: "Un cálculo o una regla que corre el motor — p. ej. «Calcular el descuento»."
        palette_script_task_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. El menú rápido junto al elemento agrega el siguiente elemento ya conectado; pedirle una segunda salida ofrece «Bifurcar con» un gateway. Se exporta a BPMN XML como <bpmn:scriptTask>."
        palette_business_rule_task_summary: "Evalúa reglas de negocio o una tabla de decisión y devuelve el resultado."
        palette_business_rule_task_when: "Una decisión que toman las reglas, no una persona — p. ej. «Determinar el nivel de aprobación»."
        palette_business_rule_task_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. El menú rápido junto al elemento agrega el siguiente elemento ya conectado; pedirle una segunda salida ofrece «Bifurcar con» un gateway. Se exporta a BPMN XML como <bpmn:businessRuleTask>."
        palette_manual_task_summary: "Trabajo que una persona hace sin ninguna aplicación."
        palette_manual_task_when: "Trabajo físico o fuera de sistema — p. ej. «Empacar el pedido»."
        palette_manual_task_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. El menú rápido junto al elemento agrega el siguiente elemento ya conectado; pedirle una segunda salida ofrece «Bifurcar con» un gateway. Se exporta a BPMN XML como <bpmn:manualTask>."
        palette_sub_process_summary: "Un subproceso colapsado (actividad de llamada): otro proceso que este flujo ejecuta y espera, con su marcador [+]."
        palette_sub_process_when: "Reutilizar un procedimiento documentado aparte — p. ej. «Alta de proveedor»."
        palette_sub_process_editor: "Se liga a una entidad de la app desde el panel de propiedades: una búsqueda (urls[:references]) o «Crear nuevo» en el drawer de la app (urls[:new_reference]), que se abre solo al colocarlo cuando no hay búsqueda. Mientras está ligado, su nombre es el de la referencia y el doble clic abre su página (antes, el evento cancelable bali-bpmn:open-reference); sin ligar, su contorno es punteado. Su color es el token --bpmn-sub-process, gris por omisión. Lo de «Por colocar» se arrastra al lienzo ya ligado. Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. El menú rápido junto al elemento agrega el siguiente elemento ya conectado; pedirle una segunda salida ofrece «Bifurcar con» un gateway. Se exporta a BPMN XML como <bpmn:callActivity>, con calledElement si está ligado."
        palette_binary_decision_summary: "Un gateway exclusivo con dos respuestas a una pregunta, dibujado sin su marcador X."
        palette_binary_decision_when: "Una pregunta de sí o no — p. ej. «¿La factura es válida?»."
        palette_binary_decision_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Azul y sin X; sus dos primeras salidas nacen con las etiquetas Sí y No, y es la primera opción de «Bifurcar con». Se exporta a BPMN XML como <bpmn:exclusiveGateway>, with isMarkerVisible=\"false\" in its diagram shape."
        palette_exclusive_gateway_summary: "Divide el flujo en caminos alternativos de los que se toma exactamente uno, o reúne caminos alternativos."
        palette_exclusive_gateway_when: "Varias alternativas excluyentes — p. ej. «¿Alta, cambio o baja?»."
        palette_exclusive_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Sus dos primeras salidas nacen con las etiquetas Sí y No; se ofrece en «Bifurcar con». Se exporta a BPMN XML como <bpmn:exclusiveGateway>."
        palette_parallel_gateway_summary: "Divide el flujo en caminos que corren todos a la vez, o espera a que todos lleguen para unirlos."
        palette_parallel_gateway_when: "Trabajo que ocurre en paralelo — p. ej. «Revisar existencias» y «Revisar crédito» a la vez."
        palette_parallel_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Sus salidas no llevan etiqueta, porque no tienen condición; se ofrece en «Bifurcar con». Se exporta a BPMN XML como <bpmn:parallelGateway>."
        palette_inclusive_gateway_summary: "Toma cada camino cuya condición se cumple — uno o varios — y reúne los que se tomaron."
        palette_inclusive_gateway_when: "Opciones que pueden aplicar juntas — p. ej. «¿Qué revisiones aplican?»."
        palette_inclusive_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Se ofrece en «Bifurcar con» cuando la paleta lo incluye. Se exporta a BPMN XML como <bpmn:inclusiveGateway>."
        palette_complex_gateway_summary: "Divide o une bajo una condición que ningún otro gateway expresa, como «tres de cinco caminos»."
        palette_complex_gateway_when: "Sincronizaciones poco comunes — p. ej. seguir en cuanto lleguen dos de tres aprobaciones."
        palette_complex_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Fuera de eso, solo notación: se dibuja y se exporta a BPMN XML como <bpmn:complexGateway>."
        palette_event_based_gateway_summary: "Espera al primero de los eventos que le siguen y toma ese camino."
        palette_event_based_gateway_when: "Resultados que compiten — p. ej. «Respuesta recibida» o «Pasaron tres días»."
        palette_event_based_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Fuera de eso, solo notación: se dibuja y se exporta a BPMN XML como <bpmn:eventBasedGateway> con eventGatewayType=\"Exclusive\"."
        palette_event_based_start_gateway_summary: "Un gateway basado en eventos que inicia el proceso: el primero de sus eventos que ocurre crea la instancia."
        palette_event_based_start_gateway_when: "Un proceso que puede iniciar de varias formas — p. ej. un pedido por correo o por teléfono."
        palette_event_based_start_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Fuera de eso, solo notación: se dibuja y se exporta a BPMN XML como <bpmn:eventBasedGateway> con instantiate=\"true\"."
        palette_parallel_event_based_gateway_summary: "Inicia el proceso cuando todos sus eventos ya ocurrieron."
        palette_parallel_event_based_gateway_when: "Un inicio que necesita varias entradas — p. ej. «Pedido recibido» y «Pago recibido»."
        palette_parallel_event_based_gateway_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Su nombre va arriba, libre del puerto superior. Se ofrece en el menú rápido, ya conectado. Fuera de eso, solo notación: se dibuja y se exporta a BPMN XML como <bpmn:eventBasedGateway> con instantiate=\"true\" y eventGatewayType=\"Parallel\"."
        palette_lane_summary: "Una partición del pool que muestra quién hace el trabajo: un rol, un equipo o un sistema."
        palette_lane_when: "Una por cada participante cuyo trabajo aparece en el flujo — p. ej. «Cuentas por pagar»."
        palette_lane_editor: "Se agrega desde la paleta o la barra; se renombra con doble clic en su encabezado o en el panel; se reordena arrastrando el encabezado o con Subir/Bajar; se redimensiona desde su borde. El panel puede marcarlo como participante externo (carril gris, actividades blancas) cuando la app ofrece esa opción, y ligarle un responsable de la app (urls[:lane_assignees]). Los carriles internos se exportan a BPMN XML como <bpmn:lane>; uno externo, como un participante con su propio proceso."
        palette_sequence_flow_summary: "Muestra el orden en que corren los elementos de un mismo participante."
        palette_sequence_flow_when: "Unir un paso con el siguiente — p. ej. «Validar la factura» → «Registrar el pago»."
        palette_sequence_flow_editor: "Se traza desde el punto de un elemento o con Conectar, y se reconecta arrastrando sus extremos. Una actividad conserva una entrada y una salida (una segunda ofrece un gateway); nunca entra a un evento de inicio, sale de un evento de fin ni cruza participantes. Su ruta es ortogonal y rodea los elementos; su etiqueta (Sí/No al salir de una decisión) se edita con doble clic, y sus puertos en el panel. Se exporta a BPMN XML como <bpmn:sequenceFlow>."
        palette_message_flow_summary: "Un mensaje entre dos participantes, nunca dentro de uno."
        palette_message_flow_when: "Comunicación con alguien de fuera — p. ej. «Orden de compra» al proveedor."
        palette_message_flow_editor: "Solo entre participantes distintos: un carril externo y el proceso, o dos carriles externos. Punteado, con un círculo al inicio y una flecha hueca. Se exporta a BPMN XML como <bpmn:messageFlow> en la colaboración."
        palette_association_summary: "Liga un artefacto o un dato a otro elemento; no lleva flujo."
        palette_association_when: "Pegar una nota o un documento al paso del que trata — p. ej. una anotación en «Validar la factura»."
        palette_association_editor: "Uno de sus extremos debe ser un artefacto o un dato. Línea punteada. Se exporta a BPMN XML como <bpmn:association>."
        palette_text_annotation_summary: "Una nota que explica algo del diagrama; no cambia el flujo."
        palette_text_annotation_when: "Aclarar un paso — p. ej. «Revisar datos fiscales y montos»."
        palette_text_annotation_editor: "Su texto va dentro del corchete; se pega a un elemento con una asociación. Se exporta a BPMN XML como <bpmn:textAnnotation>."
        palette_group_summary: "Un marco visual alrededor de elementos que van juntos; no cambia el flujo."
        palette_group_when: "Marcar una etapa del proceso — p. ej. «Cierre de mes»."
        palette_group_editor: "Su nombre va arriba a la izquierda, y nunca cuenta como encimado con lo que enmarca. Se exporta a BPMN XML como <bpmn:group>."
        palette_data_object_summary: "Información que el proceso usa o produce."
        palette_data_object_when: "Un documento o registro que un paso necesita o crea — p. ej. «Factura»."
        palette_data_object_editor: "Su nombre va debajo; se liga a un paso con una asociación. Se exporta a BPMN XML como <bpmn:dataObjectReference> con su <bpmn:dataObject>."
        palette_data_collection_summary: "Un objeto de datos que contiene una colección de elementos."
        palette_data_collection_when: "Varios elementos del mismo tipo — p. ej. «Partidas del pedido»."
        palette_data_collection_editor: "Su nombre va debajo; se liga a un paso con una asociación. Se exporta a BPMN XML como <bpmn:dataObjectReference>, con su <bpmn:dataObject> marcado isCollection=\"true\"."
        palette_data_input_summary: "Datos que el proceso recibe de fuera para hacer su trabajo."
        palette_data_input_when: "Una entrada que el proceso necesita — p. ej. «Solicitud del cliente»."
        palette_data_input_editor: "Su nombre va debajo; se liga a un paso con una asociación. Se dibuja con una flecha hueca. Se exporta a BPMN XML como un <bpmn:dataObjectReference>, como un objeto de datos, no como una entrada del proceso."
        palette_data_output_summary: "Datos que el proceso entrega como resultado."
        palette_data_output_when: "Lo que el proceso entrega — p. ej. «Contrato firmado»."
        palette_data_output_editor: "Su nombre va debajo; se liga a un paso con una asociación. Se dibuja con una flecha rellena. Se exporta a BPMN XML como un <bpmn:dataObjectReference>, como un objeto de datos, no como una salida del proceso."
        palette_data_store_summary: "Donde el proceso guarda o consulta información que dura más que una instancia."
        palette_data_store_when: "Una base de datos o un sistema de registro — p. ej. «Padrón de clientes»."
        palette_data_store_editor: "Su nombre va debajo; se liga a un paso con una asociación. Se exporta a BPMN XML como <bpmn:dataStoreReference>."
        palette_start_event_summary: "Donde inicia el proceso, sin un detonante en particular."
        palette_start_event_when: "Un inicio sin detonante definido — p. ej. «Solicitud recibida»."
        palette_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No recibe flujo de secuencia entrante. Se exporta a BPMN XML como <bpmn:startEvent>."
        palette_timer_start_event_summary: "Inicia el proceso en una fecha, una hora o un intervalo recurrente."
        palette_timer_start_event_when: "Un proceso programado — p. ej. «Día de cierre de mes»."
        palette_timer_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. La expresión de tiempo (ISO 8601, p. ej. PT1H) del panel de propiedades sale como el timeDuration del temporizador. No recibe flujo de secuencia entrante. Se exporta a BPMN XML como <bpmn:startEvent> con timerEventDefinition."
        palette_message_start_event_summary: "Inicia el proceso cuando llega un mensaje de otro participante."
        palette_message_start_event_when: "Un proceso que alguien de fuera detona — p. ej. «Pedido recibido»."
        palette_message_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No recibe flujo de secuencia entrante; sí puede llegarle un flujo de mensaje de otro participante. Se exporta a BPMN XML como <bpmn:startEvent> con messageEventDefinition."
        palette_conditional_start_event_summary: "Inicia el proceso cuando una condición se cumple."
        palette_conditional_start_event_when: "Un proceso que detona un estado — p. ej. «Existencias bajo el mínimo»."
        palette_conditional_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No recibe flujo de secuencia entrante. Se exporta a BPMN XML como <bpmn:startEvent> con conditionalEventDefinition."
        palette_signal_start_event_summary: "Inicia el proceso al captar una señal difundida."
        palette_signal_start_event_when: "Un proceso al que muchos reaccionan — p. ej. «Nueva lista de precios publicada»."
        palette_signal_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No recibe flujo de secuencia entrante. Se exporta a BPMN XML como <bpmn:startEvent> con signalEventDefinition."
        palette_multiple_start_event_summary: "Inicia el proceso cuando ocurre cualquiera de varios detonantes."
        palette_multiple_start_event_when: "Varias formas de entrar — p. ej. un pedido por correo o por teléfono."
        palette_multiple_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No recibe flujo de secuencia entrante. Se exporta a BPMN XML como <bpmn:startEvent> con una definición de mensaje y una de señal, que representan sus varios detonantes."
        palette_parallel_multiple_start_event_summary: "Inicia el proceso solo cuando todos sus detonantes ya ocurrieron."
        palette_parallel_multiple_start_event_when: "Un inicio que necesita todo listo — p. ej. «Contrato firmado» y «Anticipo recibido»."
        palette_parallel_multiple_start_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No recibe flujo de secuencia entrante. Se exporta a BPMN XML como <bpmn:startEvent> con una definición de mensaje y una de señal y parallelMultiple=\"true\"."
        palette_timer_event_summary: "Espera una fecha o un lapso antes de que el flujo siga."
        palette_timer_event_when: "Una espera deliberada — p. ej. «Tres días después del recordatorio»."
        palette_timer_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. La expresión de tiempo (ISO 8601, p. ej. PT1H) del panel de propiedades sale como el timeDuration del temporizador. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con timerEventDefinition."
        palette_message_event_summary: "Espera un mensaje de otro participante antes de que el flujo siga."
        palette_message_event_when: "Esperar una respuesta de fuera — p. ej. «Confirmación del proveedor recibida»."
        palette_message_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Puede llegarle un flujo de mensaje de otro participante. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con messageEventDefinition."
        palette_message_throw_event_summary: "Envía un mensaje a otro participante, y el flujo sigue."
        palette_message_throw_event_when: "Avisar a alguien sin esperar — p. ej. «Confirmación enviada»."
        palette_message_throw_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. De él puede salir un flujo de mensaje hacia otro participante. Se exporta a BPMN XML como <bpmn:intermediateThrowEvent> con messageEventDefinition."
        palette_escalation_event_summary: "Escala a un nivel superior sin detener el flujo."
        palette_escalation_event_when: "Llamar a alguien con más autoridad — p. ej. «Caso vencido escalado»."
        palette_escalation_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateThrowEvent> con escalationEventDefinition."
        palette_compensation_event_summary: "Dispara que se deshaga trabajo ya hecho."
        palette_compensation_event_when: "Revertir pasos anteriores — p. ej. «Reservación liberada»."
        palette_compensation_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateThrowEvent> con compensateEventDefinition."
        palette_conditional_event_summary: "Espera hasta que una condición se cumpla antes de que el flujo siga."
        palette_conditional_event_when: "Esperar un estado — p. ej. «Presupuesto disponible»."
        palette_conditional_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con conditionalEventDefinition."
        palette_link_event_summary: "El extremo de llegada de un enlace: el flujo continúa aquí desde el enlace que lo lanza."
        palette_link_event_when: "Continuar un flujo largo en otra parte de la página — p. ej. «Continúa en la fila 2»."
        palette_link_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se empareja con el evento de enlace del mismo nombre. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con linkEventDefinition que lleva su nombre."
        palette_link_throw_event_summary: "Salta al evento de enlace del mismo nombre, en lugar de una conexión larga."
        palette_link_throw_event_when: "Evitar una conexión que cruce todo el diagrama — p. ej. «Ir a la fila 2»."
        palette_link_throw_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se empareja con el evento de enlace del mismo nombre. Se exporta a BPMN XML como <bpmn:intermediateThrowEvent> con linkEventDefinition que lleva su nombre."
        palette_signal_event_summary: "Espera una señal difundida antes de que el flujo siga."
        palette_signal_event_when: "Reaccionar a un aviso general — p. ej. «Existencias repuestas»."
        palette_signal_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con signalEventDefinition."
        palette_signal_throw_event_summary: "Difunde una señal que cualquiera que escuche puede captar, y el flujo sigue."
        palette_signal_throw_event_when: "Anunciar algo a quien le interese — p. ej. «Lista de precios publicada»."
        palette_signal_throw_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateThrowEvent> con signalEventDefinition."
        palette_multiple_event_summary: "Espera cualquiera de varios detonantes antes de que el flujo siga."
        palette_multiple_event_when: "Varias cosas pueden dejar seguir el flujo — p. ej. una respuesta por correo o por teléfono."
        palette_multiple_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con una definición de mensaje y una de señal, que representan sus varios detonantes."
        palette_parallel_multiple_event_summary: "Espera a que ocurran todos sus detonantes antes de que el flujo siga."
        palette_parallel_multiple_event_when: "El flujo necesita varias cosas antes — p. ej. «Documentos recibidos» y «Cuota pagada»."
        palette_parallel_multiple_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. Soltado sobre una conexión, se inserta en ella. Se ofrece en el menú rápido, ya conectado. Se exporta a BPMN XML como <bpmn:intermediateCatchEvent> con una definición de mensaje y una de señal (la marca de paralelo solo se escribe en los eventos de inicio)."
        palette_end_event_summary: "Donde termina un camino del proceso, sin un resultado en particular."
        palette_end_event_when: "El resultado de un camino — p. ej. «Solicitud aprobada»."
        palette_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent>."
        palette_message_end_event_summary: "Termina el camino enviando un mensaje a otro participante."
        palette_message_end_event_when: "Avisar a alguien cómo terminó — p. ej. «Rechazo notificado»."
        palette_message_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de secuencia de salida (sí puede salir de él un flujo de mensaje hacia otro participante), y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con messageEventDefinition."
        palette_error_end_event_summary: "Termina el camino lanzando un error que debe atender un proceso que lo contiene."
        palette_error_end_event_when: "Una falla que alguien más debe atender — p. ej. «Pago fallido»."
        palette_error_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con errorEventDefinition."
        palette_cancel_end_event_summary: "Cancela el subproceso de transacción en el que termina."
        palette_cancel_end_event_when: "Deshacer una transacción completa — p. ej. «Reservación cancelada»."
        palette_cancel_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con cancelEventDefinition."
        palette_compensation_end_event_summary: "Termina el camino y dispara la compensación del trabajo ya hecho."
        palette_compensation_end_event_when: "Revertir lo hecho antes de terminar — p. ej. «Cargos revertidos»."
        palette_compensation_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con compensateEventDefinition."
        palette_signal_end_event_summary: "Termina el camino difundiendo una señal."
        palette_signal_end_event_when: "Anunciar el final a quien le interese — p. ej. «Campaña cerrada»."
        palette_signal_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con signalEventDefinition."
        palette_terminate_end_event_summary: "Termina todo el proceso de inmediato, deteniendo cada camino que siga activo."
        palette_terminate_end_event_when: "Un resultado que vuelve inútil lo demás — p. ej. «Pedido cancelado»."
        palette_terminate_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con terminateEventDefinition."
        palette_multiple_end_event_summary: "Termina el camino con varios resultados a la vez, como un mensaje y una señal."
        palette_multiple_end_event_when: "Un final que avisa a varios — p. ej. «Pedido enviado y facturado»."
        palette_multiple_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con una definición de mensaje y una de señal."
        palette_escalation_end_event_summary: "Termina el camino escalando a un nivel superior."
        palette_escalation_end_event_when: "Pasar el caso a un nivel superior — p. ej. «Queja escalada»."
        palette_escalation_end_event_editor: "Nombre y descripción en el panel de propiedades, con los campos de la app; doble clic lo renombra en el lienzo. No tiene flujo de salida, y el menú rápido no aparece en él. Se exporta a BPMN XML como <bpmn:endEvent> con escalationEventDefinition."
