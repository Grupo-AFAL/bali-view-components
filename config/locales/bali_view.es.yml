        label: "Escribe un mensaje"
        send: "Enviar"
        placeholder: "Escribe un mensaje…"
      typing_indicator:
        label: "Escribiendo…"

    comment_thread:
      empty: "Aún no hay comentarios."

    attachments:
      download: "Descargar %{filename}"
      remove: "Quitar %{filename}"
      remove_confirm: "¿Quitar «%{filename}»?"
