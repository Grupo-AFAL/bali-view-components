      status_unsaved: "Unsaved changes"
      status_saving: "Saving..."
      status_saved: "Saved at %{time}"
      status_failed: "Save failed"

      # Version preview banner label, interpolated in JavaScript.
      version_label: "Version %{number}"

      # Version list states. Rendered hidden and revealed by the controller (the
      # BulkActions pattern) because they carry no runtime data.
      versions_error: "Failed to load versions."
      versions_empty: "No versions yet."

      # Restore confirmation, shown through Bali's confirm dialog.
      restore_confirm: "Restore this version? Current content will be saved as a new version first."
      confirm_title: "Restore version"
      confirm_accept: "Restore"
      confirm_cancel: "Cancel"
    block_editor:
