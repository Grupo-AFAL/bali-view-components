        select_values: "Select values..."

      # Boolean
      boolean:
        any: "Any"
        "yes": "Yes"
        "no": "No"

      # Operators
      operators:
        # Text operators
        contains: "contains"
        equals: "is exactly"
        starts_with: "starts with"
        ends_with: "ends with"
        not_contains: "does not contain"
        not_equals: "is not"
        # Date/time operators
        "on": "is"
        is: "is"
        is_not: "is not"
        between: "between"
        after: "after"
        before: "before"
        on_or_after: "on or after"
        on_or_before: "on or before"
        # Select operators
        is_any_of: "is any of"
        is_not_any_of: "is not any of"
        # Number operators
        greater_than: "greater than"
        less_than: "less than"
        greater_than_or_equal: "greater than or equal"
        less_than_or_equal: "less than or equal"

    # Simple filters
    simple_filters:
      apply: "Filter"
      clear: "Clear"
      # Named periods for a date_range filter (see Bali::DateRangePresets). `custom`
      # reveals the date picker; `any` is the blank option when the filter declares no
      # `blank:` of its own. `custom_range` names the picker itself when the filter has
      # neither caption nor `aria_label:` — it cannot borrow `any`, which says the
      # opposite of what the picker is for.
      presets:
        any: "Any date"
        custom: "Custom…"
        custom_range: "Custom date range"
        today: "Today"
        this_week: "This week"
        this_month: "This month"
