      actions:
        cancel: "Cancel"
        retry: "Retry"
        remove: "Remove"
        dismiss: "Dismiss error"
        remove_file: "Remove %{filename}"

    # FilterForm — quick text search across multiple columns
    filter_form:
      search_placeholder_with_fields: "Search by %{fields}..."

    # Form builder
    form_builder:
      date_fields:
        # Placeholder shown when `allow_input: true` and no explicit `alt_format:`
        # is given. Mirrors flatpickr's non-localized "F j, Y" token order (month
        # name, then day, then year) rather than a conventional Spanish date order,
        # since that's the literal text the field will parse.
        allow_input_placeholder: "e.g., December 31, 2026"
        clear: "Clear date"
        previous: "Previous date"
        next: "Next date"
        # Written between the two dates of a range AND used to split them back
        # apart, so a locale that translates it must keep it round-trippable.
        range_separator: " to "
      # Moved out of the host's `helpers.*` namespace, which this gem had no
      # business writing into (Rails owns it for form label/submit lookups).
      coordinates_polygon:
        clear: "Clear"
        clear_holes: "Clear holes"
        confirm: "Are you sure?"
      dynamic_fields:
        add: "Add"
      submit:
        cancel: "Cancel"
      file:
        choose_file: "Choose file"
        no_file_selected: "No file selected"
      search:
        placeholder: "Search..."
        submit: "Search"
      slim_select:
        search_placeholder: "Search"
        select_all: "Select all"
        deselect_all: "Deselect all"
        no_results: "No results"
        searching: "Searching..."
        results: "Results"

    # Saved views (B2) — Bali::SavedViewsController notices
    saved_views:
      saved: "View saved."
      renamed: "View renamed."
      updated: "View updated."
      deleted: "View deleted."

