        rule_R02: "The activity «%{name}» has more than one outgoing connection. Use a gateway to split the flow."
        rule_R03: "An outgoing connection of the gateway «%{name}» has no label."
        rule_R04: "The gateway «%{name}» already has its Yes/No paths. Add another gateway for more options."
        rule_R05: "The gateway «%{name}» opens paths that do not close with a gateway of the same type."
        rule_R06: "Say what triggers the flow in the start event."
        rule_R07: "Say how the flow ends in the end event."
        rule_R08_message: "Say which communication «%{name}» waits for or sends, for example «Payment confirmation received»."
        rule_R08_timer: "Say the term «%{name}» waits for, for example «3 days after the request»."
        rule_R09: "An element has no name."
        rule_R10: "The lane «%{name}» has no activities."
        rule_R11: "The sub-process «%{name}» is not linked to anything."
        rule_R12: "The flow needs a start event and at least one end event."
        rule_R13_in: "«%{name}» has no incoming connection."
        rule_R13_out: "«%{name}» has no outgoing connection."
        rule_R14: "The gateway «%{name}» merges and splits at once. Split it into two gateways."
        rule_R15: "The gateway «%{name}» neither splits nor merges paths; it can be removed."
        rule_R16: "There is more than one activity named «%{name}»."
        rule_R17: "Describe «%{name}» with a verb and an object, for example «Validate invoice»."
        rule_R18: "«%{name}» overlaps another element."
        rule_R19: "The flow has %{count} activities; consider splitting it into sub-processes."
        rule_R20: "The flow needs at least %{count} activities."
        rule_R21: "The flow needs at least %{count} lanes with activities (now: %{current})."
        rule_R22: "The lane needs a specific name."
        rule_R23: "«%{name}» needs a specific name."
        rule_R24_in: "The start event «%{name}» must have no incoming connections."
        rule_R24_out: "The end event «%{name}» must have no outgoing connections."
        rule_R25: "A connection points to an element that does not exist."
        rule_R26: "«%{name}» is outside the limits of a lane."
        rule_B01: "The event-based gateway «%{name}» must lead only to intermediate catch events or receive tasks, at least two of them."
        rule_B02: "A message flow joins «%{name}» to the same participant; message flows connect different participants."
        rule_B03: "An association must have a text annotation, a group or a data element at one end."
        rule_B04: "A sequence flow touches «%{name}», an artifact; artifacts and data connect with associations."
        rule_B05: "The link event «%{name}» has no matching link of the other kind with the same name."
        rule_B06: "The end event «%{name}» throws an error or a cancellation nothing can catch at this level."
        rule_B07: "The complex gateway «%{name}» is hard to read; prefer exclusive, inclusive or parallel gateways."
        rule_B08: "The process has more than one blank start event."
        rule_B09: "Two sequence flows join the same elements."
        rule_B10: "The event-based gateway «%{name}» starts the process, so it must have no incoming flow."
        rule_B11: "Phrase the decision «%{name}» as a question."
        rule_B11_verb: "«%{name}» names work; phrase the decision as a question about its result, for example «Request authorized?»."
        rule_COM-19: "«%{name}» (%{kind}) closes the paths opened by «%{opening}»; close them with: %{expected}."
        rule_COM-20: "Paths of a split nested inside «%{opening}» reach «%{name}» directly; close the inner split first."
        rule_COM-12: "The outgoing connections of the parallel gateway «%{name}» carry labels; a parallel split takes every path, so it has no conditions."
        rule_COM-02: "The Yes/No decision «%{name}» has %{count} ways out; it needs exactly two. Use an exclusive gateway for more options."
        rule_DEC-03: "The ways out of «%{name}» do not answer its question; label them %{yes} and %{no}."
        rule_COM-22: "A path returns to «%{name}» directly; bring it back through a merging exclusive gateway placed before the first activity it repeats."
        rule_EST-05: "The loop through «%{name}» has no way out; add the decision that ends it."
        rule_EST-01_start: "No path from a start event reaches «%{name}»."
        rule_EST-01_end: "No path from «%{name}» reaches an end event."
        rule_EVF-04: "Another end event is also named «%{name}»; name each result distinctly."
        rule_SUB-05_in: "Label the connection into «%{name}» with what the procedure receives."
        rule_SUB-05_out: "Label the connection out of «%{name}» with what the procedure delivers."
        rule_SUB-05_same: "What «%{name}» receives and delivers have the same label; name the input and the result."
        rule_VIS-10: "«%{name}» (%{kind}) is not in the palette of this editor."
        rule_VIS-02: "The diagram does not fit its page legibly: it would print at %{scale} %, under %{min} %. Use Tidy up (compact) or move part of it to a related procedure."
        rule_ACT-02: "Name «%{name}» as an action: a verb and its object, for example «Validate documents»."
        rule_ACT-07: "«%{name}» only receives or passes on information; fold it into the activity that does the work."
        rule_ACT-09: "«%{name}» is an ongoing responsibility, not a step; name the concrete action."
        rule_ACT-03_vague: "«%{name}» does not say what is done; name the concrete action."
        rule_ACT-03_operative: "«%{name}» is a screen instruction; name the activity at procedure level."
        rule_ACT-03_several: "«%{name}» holds several actions; draw each as its own activity."
        rule_ACT-10: "A decision with the result of «%{name}» should follow it."
        rule_EVI-03: "The event «%{name}» is worded as an action; name the fact or state, for example «Request received»."
        rule_EVI-05: "The start «%{name}» depends on a date or period; use a timer start event."
        rule_LAN-08: "The lanes «%{other}» and «%{name}» look like the same participant; use one name."
