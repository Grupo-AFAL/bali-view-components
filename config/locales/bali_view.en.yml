        placeholder: "Select value"
        search_placeholder: "Search"
        select_all: "Select all"
        deselect_all: "Deselect all"
        no_results: "No results"
        searching: "Searching..."
        results: "Results"
        ajax_placeholder: "Type 2 chars to search..."
        ajax_error: "Search failed. Please try again."
