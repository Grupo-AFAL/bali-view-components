        # name, then day, then year) rather than a conventional Spanish date order,
        # since that's the literal text the field will parse.
        allow_input_placeholder: "e.g., December 31, 2026"
        clear: "Clear date"
        previous: "Previous date"
        next: "Next date"
        # Written between the two dates of a range AND used to split them back
        # apart, so a locale that translates it must keep it round-trippable.
        range_separator: " to "
      # Moved out of the host's `helpers.*` namespace, which this gem had no
      # business writing into (Rails owns it for form label/submit lookups).
      coordinates_polygon:
        clear: "Clear"
        clear_holes: "Clear holes"
        confirm: "Are you sure?"
      dynamic_fields:
        add: "Add"
      submit:
