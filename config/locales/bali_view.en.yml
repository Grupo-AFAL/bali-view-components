      # The only translatable entry of the code-block language list; the rest are
      # proper names.
      plain_text: "Plain Text"
    document_page:
      toggle_toc: "Toggle table of contents"
      toggle_details: "Toggle details"
      contents: "Contents"
    rich_text_editor:
