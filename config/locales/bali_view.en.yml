        palette_task_summary: "An atomic unit of work in the process, with no type stated."
        palette_task_when: "Work whose kind does not matter for the model — e.g. «Prepare quote»."
        palette_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:task>."
        palette_user_task_summary: "Work a person does with the help of a software application."
        palette_user_task_when: "Someone fills in or reviews something in a system — e.g. «Approve request»."
        palette_user_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:userTask>."
        palette_service_task_summary: "Work an automated service or application does, with no person involved."
        palette_service_task_when: "A system call or an integration — e.g. «Issue electronic invoice»."
        palette_service_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:serviceTask>."
        palette_send_task_summary: "Sends a message to another participant; it is done once the message is sent."
        palette_send_task_when: "A step whose whole job is to send something out — e.g. «Send purchase order»."
        palette_send_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:sendTask>."
        palette_receive_task_summary: "Waits for a message from another participant; it is done when the message arrives."
        palette_receive_task_when: "A step that waits for something from outside — e.g. «Receive supplier quote»."
        palette_receive_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:receiveTask>."
        palette_script_task_summary: "A script the process engine runs by itself."
        palette_script_task_when: "A calculation or a rule run by the engine — e.g. «Calculate discount»."
        palette_script_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:scriptTask>."
        palette_business_rule_task_summary: "Evaluates business rules or a decision table and returns the result."
        palette_business_rule_task_when: "A decision made from rules, not by a person — e.g. «Determine approval level»."
        palette_business_rule_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:businessRuleTask>."
        palette_manual_task_summary: "Work a person does without any software application."
        palette_manual_task_when: "Physical or offline work — e.g. «Pack the order»."
        palette_manual_task_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:manualTask>."
        palette_sub_process_summary: "A collapsed sub-process (call activity): another process this flow runs and waits for, shown with its [+] marker."
        palette_sub_process_when: "Reusing a procedure documented on its own — e.g. «Supplier onboarding»."
        palette_sub_process_editor: "Links to an entity of the app from the properties panel: a search (urls[:references]) or «Create new» in the app's drawer (urls[:new_reference]), which opens on its own when it is placed and there is no search. While linked, its name is the reference's and a double-click opens the reference's page (the cancelable bali-bpmn:open-reference event first); it is dashed until linked. Its colour is the --bpmn-sub-process token, grey by default. Items of «To place» are dragged onto the canvas already linked. Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. The quick menu next to it adds the next element already connected; asking it for a second way out offers «Split with» a gateway. Exported to BPMN XML as <bpmn:callActivity>, with calledElement when linked."
        palette_binary_decision_summary: "An exclusive gateway with two answers to one question, drawn without its X marker."
        palette_binary_decision_when: "A yes/no question — e.g. «Is the invoice valid?»."
        palette_binary_decision_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Blue, with no X; its first two outgoing flows start labelled Yes and No, and it is the first choice of «Split with». Exported to BPMN XML as <bpmn:exclusiveGateway>, with isMarkerVisible=\"false\" in its diagram shape."
        palette_exclusive_gateway_summary: "Splits the flow into alternative paths of which exactly one is taken, or merges alternative paths."
        palette_exclusive_gateway_when: "Several mutually exclusive alternatives — e.g. «New, change or cancellation?»."
        palette_exclusive_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Its first two outgoing flows start labelled Yes and No; it is offered in «Split with». Exported to BPMN XML as <bpmn:exclusiveGateway>."
        palette_parallel_gateway_summary: "Splits the flow into paths that all run at the same time, or waits for all of them to join."
        palette_parallel_gateway_when: "Work that happens in parallel — e.g. «Check stock» and «Check credit» at once."
        palette_parallel_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Its outgoing flows take no label, since they carry no condition; it is offered in «Split with». Exported to BPMN XML as <bpmn:parallelGateway>."
        palette_inclusive_gateway_summary: "Takes every path whose condition holds — one or several — and merges the ones that were taken."
        palette_inclusive_gateway_when: "Options that can apply together — e.g. «Which reviews apply?»."
        palette_inclusive_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. It is offered in «Split with» when the palette includes it. Exported to BPMN XML as <bpmn:inclusiveGateway>."
        palette_complex_gateway_summary: "Splits or joins under a condition no other gateway can express, such as «three of five paths»."
        palette_complex_gateway_when: "Unusual synchronizations — e.g. go on once two of three approvals arrive."
        palette_complex_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Beyond that, notation only: drawn, and exported to BPMN XML as <bpmn:complexGateway>."
        palette_event_based_gateway_summary: "Waits for whichever of the following events happens first, and takes that path."
        palette_event_based_gateway_when: "Racing outcomes — e.g. «Reply received» or «Three days passed»."
        palette_event_based_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Beyond that, notation only: drawn, and exported to BPMN XML as <bpmn:eventBasedGateway> with eventGatewayType=\"Exclusive\"."
        palette_event_based_start_gateway_summary: "An event-based gateway that starts the process: the first of its events to happen creates the instance."
        palette_event_based_start_gateway_when: "A process that can start in several ways — e.g. an order by email or by phone."
        palette_event_based_start_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Beyond that, notation only: drawn, and exported to BPMN XML as <bpmn:eventBasedGateway> with instantiate=\"true\"."
        palette_parallel_event_based_gateway_summary: "Starts the process once all of its events have happened."
        palette_parallel_event_based_gateway_when: "A start that needs several inputs — e.g. «Order received» and «Payment received»."
        palette_parallel_event_based_gateway_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Its name sits above it, clear of the top port. Offered in the quick menu, already connected. Beyond that, notation only: drawn, and exported to BPMN XML as <bpmn:eventBasedGateway> with instantiate=\"true\" and eventGatewayType=\"Parallel\"."
        palette_lane_summary: "A partition of the pool that shows who does the work: a role, a team or a system."
        palette_lane_when: "One per participant whose work appears in the flow — e.g. «Accounts payable»."
        palette_lane_editor: "Added from the palette or the toolbar; renamed with a double-click on its header or in the panel; reordered by dragging its header or with Move up/down; resized from its edge. The panel can mark it as an external participant (grey lane, white activities) when the app offers that option, and link an assignee of the app (urls[:lane_assignees]). Internal lanes are exported to BPMN XML as <bpmn:lane>; an external one as a participant with a process of its own."
        palette_sequence_flow_summary: "Shows the order in which the elements of one participant run."
        palette_sequence_flow_when: "Joining one step to the next — e.g. «Validate invoice» → «Record payment»."
        palette_sequence_flow_editor: "Drawn from an element's dot or with Connect, and reconnected by dragging its ends. An activity keeps one way in and one way out (a second offers a gateway); it never enters a start event, leaves an end event or crosses participants. Its route is orthogonal and goes around elements; its label (Yes/No out of a decision) is edited with a double-click, its ports in the panel. Exported to BPMN XML as <bpmn:sequenceFlow>."
        palette_message_flow_summary: "A message between two participants, never inside one."
        palette_message_flow_when: "Communication with an outside party — e.g. «Purchase order» to the supplier."
        palette_message_flow_editor: "Only between different participants: an external lane and the process, or two external lanes. Dashed, with a circle at its start and a hollow arrow. Exported to BPMN XML as <bpmn:messageFlow> in the collaboration."
        palette_association_summary: "Links an artifact or a data element to another element; it carries no flow."
        palette_association_when: "Attaching a note or a document to the step it is about — e.g. an annotation on «Validate invoice»."
        palette_association_editor: "One of its ends must be an artifact or a data element. Dotted line. Exported to BPMN XML as <bpmn:association>."
        palette_text_annotation_summary: "A note that explains something in the diagram; it does not change the flow."
        palette_text_annotation_when: "Clarifying a step — e.g. «Check tax ID and amounts»."
        palette_text_annotation_editor: "Its text shows inside the bracket; attach it to an element with an association. Exported to BPMN XML as <bpmn:textAnnotation>."
        palette_group_summary: "A visual frame around elements that belong together; it does not change the flow."
        palette_group_when: "Marking a stage of the process — e.g. «Month-end closing»."
        palette_group_editor: "Its name shows at the top-left, and it never counts as overlapping what it frames. Exported to BPMN XML as <bpmn:group>."
        palette_data_object_summary: "Information the process uses or produces."
        palette_data_object_when: "A document or record a step needs or creates — e.g. «Invoice»."
        palette_data_object_editor: "Its name shows under it; link it to a step with an association. Exported to BPMN XML as <bpmn:dataObjectReference> with its <bpmn:dataObject>."
        palette_data_collection_summary: "A data object that holds a collection of items."
        palette_data_collection_when: "Several items of one kind — e.g. «Order lines»."
        palette_data_collection_editor: "Its name shows under it; link it to a step with an association. Exported to BPMN XML as <bpmn:dataObjectReference>, its <bpmn:dataObject> marked isCollection=\"true\"."
        palette_data_input_summary: "Data the process receives from outside to do its work."
        palette_data_input_when: "An input the process needs — e.g. «Customer application»."
        palette_data_input_editor: "Its name shows under it; link it to a step with an association. Drawn with a hollow arrow. Exported to BPMN XML as a <bpmn:dataObjectReference>, like a data object, not as a process input."
        palette_data_output_summary: "Data the process hands out as its result."
        palette_data_output_when: "What the process delivers — e.g. «Signed contract»."
        palette_data_output_editor: "Its name shows under it; link it to a step with an association. Drawn with a filled arrow. Exported to BPMN XML as a <bpmn:dataObjectReference>, like a data object, not as a process output."
        palette_data_store_summary: "Where the process keeps or looks up information that outlives a single instance."
        palette_data_store_when: "A database or a system of record — e.g. «Customer register»."
        palette_data_store_editor: "Its name shows under it; link it to a step with an association. Exported to BPMN XML as <bpmn:dataStoreReference>."
        palette_start_event_summary: "Where the process starts, with no particular trigger."
        palette_start_event_when: "A start with no defined trigger — e.g. «Request received»."
        palette_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no incoming sequence flow. Exported to BPMN XML as <bpmn:startEvent>."
        palette_timer_start_event_summary: "Starts the process at a date, a time or a recurring interval."
        palette_timer_start_event_when: "A scheduled process — e.g. «Month-end closing day»."
        palette_timer_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. A time expression (ISO 8601, e.g. PT1H) in the properties panel goes out as the timer's timeDuration. It takes no incoming sequence flow. Exported to BPMN XML as <bpmn:startEvent> with timerEventDefinition."
        palette_message_start_event_summary: "Starts the process when a message arrives from another participant."
        palette_message_start_event_when: "A process another party sets off — e.g. «Order received»."
        palette_message_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no incoming sequence flow; a message flow from another participant may reach it. Exported to BPMN XML as <bpmn:startEvent> with messageEventDefinition."
        palette_conditional_start_event_summary: "Starts the process when a condition becomes true."
        palette_conditional_start_event_when: "A process set off by a state — e.g. «Stock below minimum»."
        palette_conditional_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no incoming sequence flow. Exported to BPMN XML as <bpmn:startEvent> with conditionalEventDefinition."
        palette_signal_start_event_summary: "Starts the process when a broadcast signal is caught."
        palette_signal_start_event_when: "A process many parties react to — e.g. «New price list published»."
        palette_signal_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no incoming sequence flow. Exported to BPMN XML as <bpmn:startEvent> with signalEventDefinition."
        palette_multiple_start_event_summary: "Starts the process when any one of several triggers happens."
        palette_multiple_start_event_when: "Several ways in — e.g. an order by email or by phone."
        palette_multiple_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no incoming sequence flow. Exported to BPMN XML as <bpmn:startEvent> with a message and a signal event definition, standing for its several triggers."
        palette_parallel_multiple_start_event_summary: "Starts the process only once all of several triggers have happened."
        palette_parallel_multiple_start_event_when: "A start that needs everything in place — e.g. «Contract signed» and «Deposit received»."
        palette_parallel_multiple_start_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no incoming sequence flow. Exported to BPMN XML as <bpmn:startEvent> with a message and a signal event definition and parallelMultiple=\"true\"."
        palette_timer_event_summary: "Waits for a date or a span of time before the flow goes on."
        palette_timer_event_when: "A deliberate wait — e.g. «Three days after the reminder»."
        palette_timer_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. A time expression (ISO 8601, e.g. PT1H) in the properties panel goes out as the timer's timeDuration. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with timerEventDefinition."
        palette_message_event_summary: "Waits for a message from another participant before the flow goes on."
        palette_message_event_when: "Waiting for an answer from outside — e.g. «Supplier confirmation received»."
        palette_message_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. A message flow from another participant may reach it. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with messageEventDefinition."
        palette_message_throw_event_summary: "Sends a message to another participant, and the flow goes on."
        palette_message_throw_event_when: "Notifying someone without waiting — e.g. «Confirmation sent»."
        palette_message_throw_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. A message flow to another participant may leave it. Exported to BPMN XML as <bpmn:intermediateThrowEvent> with messageEventDefinition."
        palette_escalation_event_summary: "Raises an escalation to a higher level without stopping the flow."
        palette_escalation_event_when: "Bringing in someone with more authority — e.g. «Overdue case escalated»."
        palette_escalation_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateThrowEvent> with escalationEventDefinition."
        palette_compensation_event_summary: "Triggers the undoing of work already done."
        palette_compensation_event_when: "Reversing earlier steps — e.g. «Reservation released»."
        palette_compensation_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateThrowEvent> with compensateEventDefinition."
        palette_conditional_event_summary: "Waits until a condition becomes true before the flow goes on."
        palette_conditional_event_when: "Waiting on a state — e.g. «Budget available»."
        palette_conditional_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with conditionalEventDefinition."
        palette_link_event_summary: "The landing end of a link: the flow continues here from the link that throws to it."
        palette_link_event_when: "Continuing a long flow elsewhere on the page — e.g. «Continue on row 2»."
        palette_link_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Pair it with the link event of the same name. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with linkEventDefinition carrying its name."
        palette_link_throw_event_summary: "Jumps to the link event of the same name, instead of a long connection."
        palette_link_throw_event_when: "Avoiding a connection across the whole diagram — e.g. «Go to row 2»."
        palette_link_throw_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Pair it with the link event of the same name. Exported to BPMN XML as <bpmn:intermediateThrowEvent> with linkEventDefinition carrying its name."
        palette_signal_event_summary: "Waits for a broadcast signal before the flow goes on."
        palette_signal_event_when: "Reacting to a general announcement — e.g. «Stock replenished»."
        palette_signal_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with signalEventDefinition."
        palette_signal_throw_event_summary: "Broadcasts a signal that anyone listening can catch, and the flow goes on."
        palette_signal_throw_event_when: "Announcing something to whoever cares — e.g. «Price list published»."
        palette_signal_throw_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateThrowEvent> with signalEventDefinition."
        palette_multiple_event_summary: "Waits for any one of several triggers before the flow goes on."
        palette_multiple_event_when: "Several things could let the flow go on — e.g. a reply by email or by phone."
        palette_multiple_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with a message and a signal event definition, standing for its several triggers."
        palette_parallel_multiple_event_summary: "Waits until all of several triggers have happened before the flow goes on."
        palette_parallel_multiple_event_when: "The flow needs several things first — e.g. «Documents received» and «Fee paid»."
        palette_parallel_multiple_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. Dropped onto a connection, it is inserted into it. Offered in the quick menu, already connected. Exported to BPMN XML as <bpmn:intermediateCatchEvent> with a message and a signal event definition (the parallel mark is written only on start events)."
        palette_end_event_summary: "Where a path of the process ends, with no particular result."
        palette_end_event_when: "The outcome of a path — e.g. «Request approved»."
        palette_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent>."
        palette_message_end_event_summary: "Ends the path by sending a message to another participant."
        palette_message_end_event_when: "Telling someone how it ended — e.g. «Rejection notified»."
        palette_message_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing sequence flow (a message flow to another participant may leave it), and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with messageEventDefinition."
        palette_error_end_event_summary: "Ends the path by throwing an error for an enclosing process to handle."
        palette_error_end_event_when: "A failure someone else must deal with — e.g. «Payment failed»."
        palette_error_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with errorEventDefinition."
        palette_cancel_end_event_summary: "Cancels the transaction sub-process it ends in."
        palette_cancel_end_event_when: "Undoing a whole transaction — e.g. «Booking cancelled»."
        palette_cancel_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with cancelEventDefinition."
        palette_compensation_end_event_summary: "Ends the path and triggers the compensation of work already done."
        palette_compensation_end_event_when: "Reversing what was done before ending — e.g. «Charges reversed»."
        palette_compensation_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with compensateEventDefinition."
        palette_signal_end_event_summary: "Ends the path by broadcasting a signal."
        palette_signal_end_event_when: "Announcing the end to whoever cares — e.g. «Campaign closed»."
        palette_signal_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with signalEventDefinition."
        palette_terminate_end_event_summary: "Ends the whole process at once, stopping every path still running."
        palette_terminate_end_event_when: "An outcome that makes everything else pointless — e.g. «Order cancelled»."
        palette_terminate_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with terminateEventDefinition."
        palette_multiple_end_event_summary: "Ends the path with several results at once, such as a message and a signal."
        palette_multiple_end_event_when: "One ending that tells several parties — e.g. «Order shipped and invoiced»."
        palette_multiple_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with a message and a signal event definition."
        palette_escalation_end_event_summary: "Ends the path by raising an escalation."
        palette_escalation_end_event_when: "Handing the case to a higher level — e.g. «Complaint escalated»."
        palette_escalation_end_event_editor: "Name and description in the properties panel, with the app's fields; a double-click renames it on the canvas. It takes no outgoing flow, and the quick menu does not show for it. Exported to BPMN XML as <bpmn:endEvent> with escalationEventDefinition."
