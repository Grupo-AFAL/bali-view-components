      search_placeholder: "Search..."
      search: "Search..."
      select_field: "Select field..."
      select_value: "Select..."
      select_values: "Select values..."
      enter_value: "Enter value..."
      remove_condition: "Remove condition"
      remove_filter: "Remove filter"
      add_condition: "Add condition"
      add_group: "Add filter group"
      clear_all: "Clear all"
      apply: "Apply"
      apply_filters: "Apply Filters"
      reset: "Reset"
      clear_search: "Clear search"
      submit_search: "Search"
      active_filters: "Active filters:"
      auto_saved: "Auto-saved"
      filters_saved: "Filters are saved automatically"
      persistence_enabled: "Filters are being saved. Click to disable."
      persistence_disabled: "Filters are not saved. Click to enable."
      persistence_label: "Remember filters"

      # Date/time placeholders
      select_date: "Select date..."
      select_datetime: "Select date & time..."
      select_date_range: "Select date range..."
      select_datetime_range: "Select date & time range..."

      # Boolean values
      any: "Any"
      "yes": "Yes"
      "no": "No"

      # Group combinators
      combinators:
        and: "AND"
        or: "OR"

      # Selected count for multi-select
      selected_count: "%{count} selected"

      # Placeholders (nested structure for JavaScript controller)
      placeholders:
        enter_value: "Enter value..."
        number: "0"
        select_date: "Select date..."
        select_datetime: "Select date & time..."
        select_date_range: "Select date range..."
        select_datetime_range: "Select date & time range..."
        select: "Select..."
        select_values: "Select values..."

      # Boolean (nested structure for JavaScript controller)
      boolean:
        any: "Any"
        "yes": "Yes"
        "no": "No"

      # Operators
      operators:
        # Text operators
        contains: "contains"
        equals: "is exactly"
        starts_with: "starts with"
        ends_with: "ends with"
        not_contains: "does not contain"
        not_equals: "is not"
        # Date/time operators
        "on": "is"
        is: "is"
        is_not: "is not"
        between: "between"
        after: "after"
        before: "before"
        on_or_after: "on or after"
        on_or_before: "on or before"
        # Select operators
        is_any_of: "is any of"
        is_not_any_of: "is not any of"
        # Number operators
        greater_than: "greater than"
        less_than: "less than"
        greater_than_or_equal: "greater than or equal"
        less_than_or_equal: "less than or equal"

    # Simple filters
    simple_filters:
      apply: "Filter"
      clear: "Clear"

    # File input
    file_input:
      remove: "Remove %{name}"

    # Side menu
    side_menu:
      label: "Sidebar"
      collapse: "Collapse sidebar"
      expand: "Expand sidebar"
      toggle_item: "Toggle %{name}"
      close: "Close sidebar"
      trigger:
        toggle: "Open sidebar"

    # App layout
    app_layout:
      skip_to_content: "Skip to main content"

    # Command palette (⌘K)
    command:
      esc_key: "esc"
      placeholder: "Search…"
      no_results: "No results"
      navigate: "navigate"
      open_action: "open"
      close: "close"

    # Modal
    modal:
      close: "Close modal"
      confirm_close: "You have unsaved changes. Discard them?"

    # Image grid
    image_grid:
      expand: "Expand image"
      empty_state:
        title: "No images yet"
        add_image: "Add image"

    # Breadcrumb
    breadcrumb:
      aria_label: "Breadcrumb"

    # Direct upload
    direct_upload:
      drop_zone:
        title: "Drag files here"
        or: "or"
        browse: "Browse Files"
        aria_label: "Drop files here or click to browse"
      file_list:
        aria_label: "Files to upload"
      file_status:
        pending: "Waiting..."
        uploading: "Uploading..."
        completed: "Uploaded"
        error: "Failed"
      status:
        uploaded: "Already uploaded"
      errors:
        too_many_files: "Maximum %{max} files allowed"
        file_too_large: "File exceeds %{max}MB limit"
