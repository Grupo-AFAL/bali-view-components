      add_group: "Add filter group"
      clear_all: "Clear all"
      apply: "Apply"
      apply_filters: "Apply Filters"
      reset: "Reset"
      clear_search: "Clear search"
      submit_search: "Search"
      active_filters: "Active filters:"
      auto_saved: "Auto-saved"
      filters_saved: "Filters are saved automatically"
      persistence_enabled: "Filters are being saved. Click to disable."
      persistence_disabled: "Filters are not saved. Click to enable."
      persistence_label: "Remember filters"

