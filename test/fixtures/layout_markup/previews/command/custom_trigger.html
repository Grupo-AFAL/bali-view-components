<div class="p-6 bg-base-200 min-h-[480px]">
  <div class="bali-command" data-controller="command" data-command-results-value="{&quot;one&quot;:&quot;%{count} result&quot;,&quot;other&quot;:&quot;%{count} results&quot;}">
    <div data-action="click->command#open">
            <button class="btn btn-ghost btn-sm max-sm:btn-square btn-square" aria-label="Open command palette" type="button">
    <span class="icon-component" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" width="16" height="16" class="lucide-icon"><!-- lucide: search --></svg></span>

    

  
</button>

    </div>

  <dialog data-command-target="surface" class="bali-command-surface" aria-label="Search…">
    <div data-command-target="backdrop"
         data-action="click->command#close"
         class="hidden fixed inset-0 bg-black/40 z-[calc(var(--bali-z-command)_-_1)]"></div>

    <div data-command-target="panel"
         class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-[var(--bali-z-command)] w-[520px] max-w-[calc(100vw-2rem)]">
      <div class="cmd-panel bg-base-100 border border-base-content/15 rounded-box shadow-xl flex flex-col overflow-hidden ">
        <div class="cmd-input-wrap flex items-center gap-3 border-b border-base-200 text-base-content/60">
          <span class="icon-component size-4 shrink-0" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" width="16" height="16" class="lucide-icon"><!-- lucide: search --></svg></span>
          <input data-command-target="input"
                 data-action="input->command#filter keydown->command#nav"
                 type="text"
                 placeholder="Search…"
                 class="cmd-input flex-1 min-w-0 bg-transparent border-0 outline-none text-base-content placeholder:text-base-content/70"
                 aria-label="Search…" />
          <kbd class="kbd kbd-xs">esc</kbd>
        </div>

        <div class="cmd-list p-1.5 max-h-80 overflow-y-auto">
            <div data-command-target="group" data-mode="searchable">
  <div class="cmd-group text-xs font-semibold uppercase tracking-wider text-base-content/70 px-3 pt-3 pb-1.5">Pages</div>
    <button type="button" class="cmd-row group flex items-center gap-2.5 w-full rounded-md text-left text-sm text-base-content cursor-pointer" data-command-target="row" data-mode="searchable" data-href="/lookbook" data-search="dashboard overview" data-action="click-&gt;command#select">
    <span class="cmd-row-ic size-7 rounded-md grid place-items-center shrink-0">
      <span class="icon-component size-3.5" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" width="16" height="16" class="lucide-icon"><!-- lucide: layout-dashboard --></svg></span>
    </span>
  <span class="cmd-row-body flex-1 min-w-0 flex">
    <span class="cmd-row-title text-sm text-base-content truncate">Dashboard</span>
      <span class="cmd-row-meta text-xs text-base-content/70 truncate">Overview</span>
  </span>
  <span class="cmd-row-hint shrink-0 inline-flex items-center gap-1 transition-opacity">
    <kbd class="kbd kbd-xs">⏎</kbd>
  </span>
</button>
    <button type="button" class="cmd-row group flex items-center gap-2.5 w-full rounded-md text-left text-sm text-base-content cursor-pointer" data-command-target="row" data-mode="searchable" data-href="/lookbook" data-search="reports analytics" data-action="click-&gt;command#select">
    <span class="cmd-row-ic size-7 rounded-md grid place-items-center shrink-0">
      <span class="icon-component size-3.5" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" width="16" height="16" class="lucide-icon"><!-- lucide: chart-column --></svg></span>
    </span>
  <span class="cmd-row-body flex-1 min-w-0 flex">
    <span class="cmd-row-title text-sm text-base-content truncate">Reports</span>
      <span class="cmd-row-meta text-xs text-base-content/70 truncate">Analytics</span>
  </span>
  <span class="cmd-row-hint shrink-0 inline-flex items-center gap-1 transition-opacity">
    <kbd class="kbd kbd-xs">⏎</kbd>
  </span>
</button>
</div>

          <div data-command-target="noResults" class="hidden text-center px-4 pt-8 pb-3">
            <div class="text-sm font-semibold text-base-content">No results</div>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3 px-3 py-2 border-t border-base-200 bg-base-100 text-xs text-base-content/70">
          <span class="inline-flex items-center gap-1.5"><kbd class="kbd kbd-xs">↑</kbd><kbd class="kbd kbd-xs">↓</kbd> navigate</span>
          <span class="inline-flex items-center gap-1.5"><kbd class="kbd kbd-xs">⏎</kbd> open</span>
          <span class="inline-flex items-center gap-1.5"><kbd class="kbd kbd-xs">esc</kbd> close</span>
          <span class="ml-auto font-mono text-[10.5px] text-base-content/70" data-command-target="count"></span>
        </div>
      </div>
    </div>
  </dialog>
</div></div>
