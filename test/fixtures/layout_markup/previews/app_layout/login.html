<body class="app-layout flex flex-col min-h-screen bg-base-200" data-controller="app-layout">
    <a href="#main-content" class="bali-skip-link">Skip to main content</a>



  <div class="app-layout-main flex flex-1 min-h-0">
    

    <div class="app-layout-content flex-1 min-w-0 flex flex-col">

      <main id="main-content" tabindex="-1" class="flex-1">
        <div class="app-layout-body-container max-w-xl px-4 py-4 mx-auto">
          
    <div class="flex items-center justify-center min-h-screen">
      <div class="card bg-base-100 card-border shadow-sm">
  
    <div class="card-body p-8">
      
      
      
        <div class="w-80">
          <div class="text-center mb-6">
            <h1 class="text-2xl font-bold">Welcome back</h1>
            <p class="text-sm text-base-content/60 mt-1">Sign in to your MovieDB account</p>
          </div>

          <form class="space-y-4">
            <div>
              <label class="label"><span>Email</span></label>
              <label class="input flex items-center gap-2 w-full">
                <span class="icon-component text-base-content/40" style="--bali-icon-size: 1rem" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" width="16" height="16" class="lucide-icon"><!-- lucide: mail --></svg></span>
                <input type="email" placeholder="you@example.com" class="grow" />
              </label>
            </div>

            <div>
              <label class="label">
                <span>Password</span>
                <a class="link inline-flex items-center gap-1 link-hover" href="/lookbook">
    Forgot password?
  
  
</a>
              </label>
              <label class="input flex items-center gap-2 w-full">
                <span class="icon-component text-base-content/40" style="--bali-icon-size: 1rem" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" width="16" height="16" class="lucide-icon"><!-- lucide: lock --></svg></span>
                <input type="password" placeholder="••••••••" class="grow" />
              </label>
            </div>

            <button class="btn btn-primary w-full" type="submit">

    Sign in

  
</button>
          </form>

          <div class="divider text-xs text-base-content/40 my-6">OR</div>

          <div class="space-y-2">
            <button class="btn btn-outline w-full" type="button">

    Continue with Google

  
</button>
          </div>

          <p class="text-center text-sm text-base-content/60 mt-6">
            Don't have an account?
            <a class="link inline-flex items-center gap-1" href="/lookbook">
    Create one
  
  
</a>
          </p>
        </div>

    </div>
</div>    </div>

        </div>


      </main>
    </div>
  </div>

</body>
